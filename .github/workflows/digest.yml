name: Claude Ecosystem Digest

on:
  schedule:
    # Every 3 days: days 1,4,7,...,28 at 8am UTC.
    # Note: cron '*/3' resets monthly with irregular gaps at month-end (day 28→1 = 4-day gap).
    # This explicit list ensures a reliable 3-day cadence.
    - cron: '0 8 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log email HTML but do not send (for testing)'
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        run: python src/main.py
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
          DRY_RUN: ${{ inputs.dry_run || '' }}

      - name: Commit state and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          git diff --staged --quiet || git commit -m "chore: update digest state and archive [skip ci]"
          git push --force-with-lease
